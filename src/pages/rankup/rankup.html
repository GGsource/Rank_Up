<section id="rankup-view" class="page-view rankup-view allow-image-hover">
	<div id="header-box">
		<!-- Header Title - Title of the grid. -->
		<input id="header-title" type="text" placeholder="Placeholder Title" class="header-text" maxlength="50" readonly />
		<!-- Header Description - Describes what the grid is about or whatever the author wants. -->
		<textarea
			id="header-description"
			placeholder="Placeholder Description"
			class="header-text"
			maxlength="330"
			rows="3"
			readonly
		></textarea>
	</div>
	<!-- Row List - The list of rows where the images will be moved to. -->
	<div id="row-list"></div>
	<!-- Starter Container - The container that holds the images -->
	<div id="starter-container" class="image-container"></div>
</section>
